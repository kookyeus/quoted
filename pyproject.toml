[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quoted"
version = "0.1.0"
description = "An assertion you cannot make without the words to back it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["citation", "verification", "hallucination", "provenance", "llm", "agents"]
dependencies = []

[project.urls]
Source = "https://github.com/kookyeus/quoted"

[tool.hatch.build.targets.wheel]
packages = ["src/quoted"]
